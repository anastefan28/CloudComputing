<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — MedTriageAI</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>MedTriageAI</h1>
      <p class="subtitle">AI-Powered Medical Image Triage Assistant</p>
    </header>

    <div class="auth-section">
      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab active" id="loginTab" onclick="showTab('login')">Sign In</button>
          <button class="auth-tab" id="registerTab" onclick="showTab('register')">Register</button>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" required placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" required placeholder="Password" minlength="6">
          </div>
          <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
        </form>

        <form id="registerForm" hidden onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" required placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label for="regPassword">Password</label>
            <input type="password" id="regPassword" required placeholder="Min 6 characters" minlength="6">
          </div>
          <div class="form-group">
            <label for="regRole">I am a</label>
            <select id="regRole" required>
              <option value="patient">Patient</option>
              <option value="clinician">Clinician / Doctor</option>
            </select>
          </div>
          <button type="submit" class="btn-primary" id="regBtn">Create Account</button>
        </form>

        <div id="authError" class="error" hidden></div>
        <div id="authLoading" class="loading" hidden>
          <div class="spinner"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
